<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>Kaggle Prize Hunter</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0e1a2c;--panel2:#13233a;--line:#223754;--text:#f5f8ff;--muted:#9eb0c9;--good:#43d69b;--warn:#ffc857;--bad:#ff6b7a;--blue:#63a7ff;--purple:#ae8cff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#122746 0,#07101d 38%,#050b13 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}
    button,a{font:inherit}.shell{max-width:720px;margin:auto;padding:18px 16px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#51a8ff,#886dff);box-shadow:0 12px 35px #427ed733;font-size:24px}.eyebrow{font-size:12px;color:#8ea5c4;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.title{font-size:23px;font-weight:900;letter-spacing:-.03em}.refresh{border:1px solid var(--line);background:#101f33;color:#dce8f8;border-radius:13px;padding:11px 13px;cursor:pointer}.refresh:active{transform:scale(.98)}
    .hero{padding:18px;border:1px solid #28405f;border-radius:22px;background:linear-gradient(145deg,#12243cdd,#0b1728e8);box-shadow:0 20px 60px #0006;margin-bottom:14px}.heroRow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.hero h1{font-size:18px;margin:3px 0 6px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.pulse{white-space:nowrap;padding:6px 9px;border-radius:999px;background:#173528;color:#6ee7b7;font-size:11px;font-weight:900;border:1px solid #275641}.pulse:before{content:"";width:7px;height:7px;display:inline-block;border-radius:99px;background:#4fe1a7;margin-right:6px;box-shadow:0 0 12px #4fe1a7}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{padding:11px 9px;border:1px solid var(--line);background:#091522aa;border-radius:14px}.stat b{font-size:18px;display:block}.stat span{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-top:2px}
    .tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 13px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#0b1728;color:#9fb0c8;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:#e9f2ff;color:#07101d;border-color:#e9f2ff}
    .sectionHead{display:flex;justify-content:space-between;align-items:end;margin:4px 2px 10px}.sectionHead h2{font-size:15px;margin:0}.sectionHead span{font-size:11px;color:var(--muted)}
    .list{display:grid;gap:11px}.card{border:1px solid var(--line);border-radius:20px;padding:15px;background:linear-gradient(145deg,#101d30,#0a1422);box-shadow:0 12px 35px #0003;cursor:pointer}.card:active{transform:scale(.995)}.cardTop{display:flex;gap:11px;align-items:flex-start}.rank{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#162a45;color:#9bc7ff;font-weight:900;flex:0 0 auto}.main{min-width:0;flex:1}.name{font-size:14px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{font-size:10px;border-radius:999px;padding:5px 8px;border:1px solid var(--line);color:#b6c6dc;background:#0a1626;font-weight:800}.pill.go{color:#75e8bb;border-color:#2e765a;background:#123126}.pill.review{color:#ffd276;border-color:#765c2e;background:#302612}.pill.maybe{color:#9fc6ff;border-color:#355f96;background:#142944}.pill.nogo{color:#ff9aa5;border-color:#7d3540;background:#33151a}
    .money{font-size:18px;font-weight:950;white-space:nowrap;letter-spacing:-.03em}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.metric{background:#07111e;border-radius:12px;padding:9px}.metric b{display:block;font-size:13px}.metric span{font-size:9px;color:#8598b3;text-transform:uppercase;font-weight:800;letter-spacing:.06em}.bar{height:5px;background:#1c2d44;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#58a8ff,#9e78ff);border-radius:99px}.flagline{font-size:11px;color:#f5c866;margin-top:11px;display:flex;gap:7px;align-items:flex-start;line-height:1.35}.empty,.error{padding:28px 18px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
    .sheetWrap{position:fixed;inset:0;background:#02060dbb;backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:30}.sheetWrap.open{display:flex}.sheet{width:100%;max-width:720px;margin:0 auto;background:#0b1626;border:1px solid #29405e;border-bottom:0;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:12px 17px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -30px 80px #0009}.handle{width:44px;height:5px;border-radius:99px;background:#3a4d66;margin:0 auto 13px}.sheetTitle{font-size:18px;font-weight:950;line-height:1.2;overflow-wrap:anywhere}.sheetMoney{font-size:28px;font-weight:950;margin:8px 0 13px}.scoreGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.scoreBox{background:#111f32;border:1px solid var(--line);border-radius:14px;padding:11px}.scoreBox b{font-size:17px}.scoreBox span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.block{margin-top:17px}.block h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9fb1ca;margin:0 0 8px}.block ul{margin:0;padding-left:18px;color:#d2dced;font-size:12px;line-height:1.5}.block li+li{margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.action{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:12px;font-size:12px;font-weight:900;border:1px solid var(--line);background:#122238;color:#dce9fb}.action.primary{background:#eaf3ff;color:#07101d;border-color:#eaf3ff}.close{position:sticky;top:0;float:right;border:0;background:#15253a;color:white;width:34px;height:34px;border-radius:12px;cursor:pointer}
    @media(min-width:620px){.shell{padding-top:28px}.card{padding:17px}.sheet{border-radius:26px 26px 0 0}.metrics{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand"><div class="logo">🏆</div><div><div class="eyebrow">Kaggle</div><div class="title">Prize Hunter</div></div></div><button class="refresh" id="refresh">↻ Refresh</button></div>
    <section class="hero"><div class="heroRow"><div><div class="eyebrow">Opportunity radar</div><h1>Find the competitions worth our time.</h1><p id="updated">Loading latest scan…</p></div><div class="pulse">LIVE</div></div><div class="stats"><div class="stat"><b id="cashCount">—</b><span>Cash prizes</span></div><div class="stat"><b id="bestPrize">—</b><span>Largest prize</span></div><div class="stat"><b id="bestFit">—</b><span>Best vetted fit</span></div></div></section>
    <div class="tabs" id="tabs"><button class="tab active" data-filter="vetted">Vetted</button><button class="tab" data-filter="all">All</button><button class="tab" data-filter="hunt">Stage 1: Hunt</button><button class="tab" data-filter="watch">Watch</button></div>
    <div class="sectionHead"><h2 id="sectionTitle">Vetted opportunities</h2><span id="resultCount"></span></div><section class="list" id="list"><div class="empty">Loading Prize Hunter…</div></section>
  </main>
  <div class="sheetWrap" id="sheetWrap"><div class="sheet"><button class="close" id="close">✕</button><div class="handle"></div><div id="sheetBody"></div></div></div>
<script>
const DATA='./latest.json'; const DOSSIERS='./dossiers.json';
let stage1=[], dossiers=[], filter='vetted';
const $=s=>document.querySelector(s);
const fmtMoney=(v)=>{if(!v)return '—';if(v>=1000000)return '$'+(v/1000000).toFixed(1)+'m';if(v>=1000)return '$'+Math.round(v/1000)+'k';return '$'+Math.round(v)};
const nice=s=>s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const verdictClass=v=>{v=(v||'').toLowerCase();return v==='go'?'go':v==='review'?'review':v==='maybe'?'maybe':'nogo'};
function merged(){const dm=new Map(dossiers.map(d=>[d.slug,d]));return stage1.map((s,i)=>({...s,rank:i+1,dossier:dm.get(s.ref)||null}));}
function render(){let items=merged();if(filter==='vetted')items=items.filter(x=>x.dossier);if(filter==='hunt')items=items.filter(x=>x.verdict==='HUNT');if(filter==='watch')items=items.filter(x=>x.verdict==='WATCH');$('#sectionTitle').textContent=filter==='vetted'?'Vetted opportunities':filter==='all'?'All cash opportunities':filter==='hunt'?'Stage 1 hunts':'Watch list';$('#resultCount').textContent=items.length+' shown';const list=$('#list');if(!items.length){list.innerHTML='<div class="empty">Nothing in this view right now.</div>';return}list.innerHTML=items.map(x=>{const d=x.dossier;const score=d?d.final_score:x.score;const verdict=d?d.verdict:x.verdict;const flag=d?.flags?.[0]||x.reasons?.[0]||'';return `<article class="card" data-slug="${x.ref}"><div class="cardTop"><div class="rank">${x.rank}</div><div class="main"><div class="name">${nice(x.ref)}</div><div class="meta"><span class="pill ${verdictClass(verdict)}">${verdict}</span><span class="pill">${x.category}</span>${d?'<span class="pill">Stage 2 vetted</span>':''}</div></div><div class="money">${fmtMoney(x.prize_value)}</div></div><div class="metrics"><div class="metric"><b>${score.toFixed(1)}</b><span>${d?'Final fit':'Stage 1'}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,score))}%"></i></div></div><div class="metric"><b>${x.team_count||'?'}</b><span>Teams</span></div><div class="metric"><b>${Math.round(x.days_left)}</b><span>Days left</span></div>${d?`<div class="metric"><b>${d.compute_fit.toFixed(0)}</b><span>Compute fit</span></div><div class="metric"><b>${d.crowd_fit.toFixed(0)}</b><span>Crowd fit</span></div>`:''}</div><div class="flagline">⚑ <span>${flag}</span></div></article>`}).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openSheet(c.dataset.slug));}
function openSheet(slug){const x=merged().find(v=>v.ref===slug);if(!x)return;const d=x.dossier;const verdict=d?d.verdict:x.verdict;const flags=d?.flags||[];const reasons=d?.reasons||x.reasons||[];$('#sheetBody').innerHTML=`<div class="eyebrow">${d?'Stage 2 dossier':'Stage 1 opportunity'}</div><div class="sheetTitle">${nice(x.ref)}</div><div class="sheetMoney">${fmtMoney(x.prize_value)}</div><div class="meta"><span class="pill ${verdictClass(verdict)}">${verdict}</span><span class="pill">${Math.round(x.days_left)} days left</span><span class="pill">${x.team_count||'?'} teams</span></div><div class="scoreGrid"><div class="scoreBox"><b>${(d?d.final_score:x.score).toFixed(1)}/100</b><span>${d?'Final suitability':'Stage 1 opportunity score'}</span></div><div class="scoreBox"><b>${d?nice(d.task_type):nice(x.category)}</b><span>${d?'Task type':'Category'}</span></div>${d?`<div class="scoreBox"><b>${d.compute_fit.toFixed(0)}/100</b><span>Compute fit</span></div><div class="scoreBox"><b>${d.data_fit.toFixed(0)}/100</b><span>Data fit</span></div>`:''}</div>${flags.length?`<div class="block"><h3>Flags</h3><ul>${flags.map(f=>`<li>${f}</li>`).join('')}</ul></div>`:''}<div class="block"><h3>Why Prize Hunter scored it this way</h3><ul>${reasons.map(r=>`<li>${r}</li>`).join('')}</ul></div><div class="actions"><a class="action primary" target="_blank" rel="noopener" href="https://www.kaggle.com/competitions/${x.ref}">Open on Kaggle</a><button class="action" onclick="navigator.clipboard?.writeText('Give me the full Prize Hunter dossier for ${x.ref}')">Copy chat command</button></div>`;$('#sheetWrap').classList.add('open');}
async function load(){try{$('#refresh').disabled=true;const [a,b]=await Promise.all([fetch(DATA+'?t='+Date.now()),fetch(DOSSIERS+'?t='+Date.now())]);if(!a.ok)throw new Error('Stage 1 data unavailable');const j=await a.json();stage1=j.opportunities||[];dossiers=b.ok?((await b.json()).dossiers||[]):[];const date=new Date(j.generated_at);$('#updated').textContent=`Last scan ${date.toLocaleString()} • ${j.feed_count||0} active listings checked`;$('#cashCount').textContent=j.count||stage1.length;$('#bestPrize').textContent=fmtMoney(Math.max(0,...stage1.map(x=>x.prize_value||0)));$('#bestFit').textContent=dossiers.length?Math.max(...dossiers.map(x=>x.final_score)).toFixed(0)+'/100':'—';render();}catch(e){$('#list').innerHTML=`<div class="error">Couldn’t load Prize Hunter data.<br><small>${e.message}</small></div>`;}finally{$('#refresh').disabled=false}}
$('#tabs').onclick=e=>{if(!e.target.dataset.filter)return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');filter=e.target.dataset.filter;render()};$('#refresh').onclick=load;$('#close').onclick=()=>$('#sheetWrap').classList.remove('open');$('#sheetWrap').onclick=e=>{if(e.target===$('#sheetWrap'))$('#sheetWrap').classList.remove('open')};load();
</script>
</body>
</html>
